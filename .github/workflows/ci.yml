name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Base del trinquete de deuda (lint y formato): el commit ANTERIOR del push. Sin esto,
      # `git show HEAD:<fichero>` compara el árbol consigo mismo —porque en CI HEAD es justo el
      # commit que se está comprobando— y las dos puertas pasaban SIEMPRE, incluso con un fichero
      # nuevo sin formatear o con reglas de lint nuevas (hallazgo de la auditoría). Si no hay SHA
      # anterior (primer push de una rama, PR, clon superficial) los scripts avisan y siguen
      # comparando contra HEAD, como antes.
      RATCHET_BASE: ${{ github.event.before }}
    steps:
      # `fetch-depth: 0`: hace falta el commit anterior en el clon para poder comparar contra él.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Angular CLI requires Node >= 22.22.3.
          node-version: 22.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Formato y lint van ANTES de los tests: son baratos y fallan pronto. Los tres son
      # trinquetes de deuda previa: exigen impecable todo fichero nuevo o ya conforme en la BASE
      # del push, y solo toleran (informando de cuánto queda) lo que ya venía mal.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # `e2e/**` no lo cubría ningún proyecto TypeScript (los specs transpilaban sin comprobar
      # tipos). Esta puerta los type-checkea con la deuda previa declarada como base.
      - name: Type-check de las pruebas E2E
        run: npm run typecheck:e2e

      - name: Unit tests
        run: npm run test:unit

      - name: Validate migrations
        run: npm run validate:migration

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Conjunto E2E ESTABLE (los recorridos núcleo). El suite completo (≈550 tests)
      # es pesado para CI; se ejecuta de noche en `nightly.yml` y a mano en desarrollo.
      # Se van sumando specs por lote (los nuevos del Lote C: fase-i-*).
      - name: E2E (estable)
        run: npx playwright test f7-persistence p11-persistence mobile-toolbar accesibilidad galerias fields features fase-h-formaciones fase-i-biblioteca fase-i-plantilla fase-i-sesiones fase-i-ajustes fase-i-shell fase-i-estilos --workers=1

      # Diagnóstico: sin esto, un fallo E2E en un push era indiagnosticable desde el log — el
      # reporter es `list`, así que NO existe `playwright-report/`; lo que Playwright deja son las
      # capturas y las trazas de `test-results/` (con `trace: 'retain-on-failure'`).
      - name: Subir capturas y trazas si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería — Contrato táctil de FASE B (CDMPLab)</title>
<style>
  body { font-family: system-ui, sans-serif; background: #10151a; color: #e8edf2; margin: 0; padding: 24px; }
  h1 { font-size: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  figure.shot { margin: 0; background: #171d23; border: 1px solid #262e35; border-radius: 8px; overflow: hidden; }
  figure.shot img { width: 100%; display: block; }
  figcaption { padding: 8px 10px; font-size: 12px; line-height: 1.4; }
  figcaption strong { display: block; margin-bottom: 4px; color: #fff; }
</style>
</head>
<body>
<h1>Galería — Contrato táctil de FASE B (CDMPLab)</h1>
<p>Móvil horizontal (844×390). Un arrastre táctil del panel al campo coloca exactamente UNA
unidad y desarma la herramienta (Cursor). Un toque posterior no coloca otra.</p>
<div class="grid"><figure class="shot">
  <img src="jugador-antes.png" alt="Jugador genérico — ANTES del arrastre: panel Jugadores abierto, barra inferior visible, campo vacío (herramienta Cursor)." loading="lazy">
  <figcaption><strong>jugador-antes.png</strong> — Jugador genérico — ANTES del arrastre: panel Jugadores abierto, barra inferior visible, campo vacío (herramienta Cursor).</figcaption>
</figure>
<figure class="shot">
  <img src="jugador-durante.png" alt="Jugador genérico — DURANTE el arrastre táctil: la pista dice «Suelta en el campo para colocar…» y la preview acompaña al puntero." loading="lazy">
  <figcaption><strong>jugador-durante.png</strong> — Jugador genérico — DURANTE el arrastre táctil: la pista dice «Suelta en el campo para colocar…» y la preview acompaña al puntero.</figcaption>
</figure>
<figure class="shot">
  <img src="jugador-despues.png" alt="Jugador genérico — DESPUÉS del drop: una sola unidad colocada, la herramienta desarmada vuelve a Cursor y el panel permanece abierto." loading="lazy">
  <figcaption><strong>jugador-despues.png</strong> — Jugador genérico — DESPUÉS del drop: una sola unidad colocada, la herramienta desarmada vuelve a Cursor y el panel permanece abierto.</figcaption>
</figure>
<figure class="shot">
  <img src="cono-antes.png" alt="Material (Cono) — ANTES del arrastre: panel Material abierto, barra inferior visible, campo vacío." loading="lazy">
  <figcaption><strong>cono-antes.png</strong> — Material (Cono) — ANTES del arrastre: panel Material abierto, barra inferior visible, campo vacío.</figcaption>
</figure>
<figure class="shot">
  <img src="cono-durante.png" alt="Material (Cono) — DURANTE el arrastre táctil: pista «Suelta en el campo para colocar…» y preview junto al puntero." loading="lazy">
  <figcaption><strong>cono-durante.png</strong> — Material (Cono) — DURANTE el arrastre táctil: pista «Suelta en el campo para colocar…» y preview junto al puntero.</figcaption>
</figure>
<figure class="shot">
  <img src="cono-despues-panel-barra.png" alt="Material (Cono) — DESPUÉS del drop: una sola unidad colocada, la herramienta vuelve a Cursor, el panel sigue abierto y la barra inferior visible." loading="lazy">
  <figcaption><strong>cono-despues-panel-barra.png</strong> — Material (Cono) — DESPUÉS del drop: una sola unidad colocada, la herramienta vuelve a Cursor, el panel sigue abierto y la barra inferior visible.</figcaption>
</figure></div>

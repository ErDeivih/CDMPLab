<app-auth-card [title]="'Restablecer contraseña'" [subtitle]="'Te ayudamos a recuperar el acceso'">
  @if (message(); as msg) {
    <p class="auth-msg" [class.ok]="msg.kind === 'ok'" [class.err]="msg.kind === 'err'" role="status">{{ msg.text }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="forgot-email">Correo electrónico</label>
      <input
        id="forgot-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="tucorreo@ejemplo.com"
        aria-describedby="forgot-email-hint"
      />
      @if (emailInvalid()) {
        <div id="forgot-email-hint" class="auth-note">
          @if (form.controls.email.hasError('required')) { El correo es obligatorio. }
          @else { Introduce un correo válido. }
        </div>
      }
    </div>

    <div class="auth-actions">
      <button type="submit" class="btn btn-primary" [disabled]="submitting() || form.invalid">
        {{ submitting() ? 'Enviando…' : 'Enviar enlace' }}
      </button>
    </div>
  </form>

  <p class="auth-note">Por seguridad, este mensaje es el mismo tanto si el correo existe como si no.</p>

  <div class="auth-row">
    <a class="auth-link" routerLink="/auth/login">Volver a iniciar sesión</a>
  </div>
</app-auth-card>

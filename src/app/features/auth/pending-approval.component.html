<app-auth-card [title]="'Aprobación pendiente'" [subtitle]="'Tu cuenta aún no está activa'">
  <p class="auth-note">
    Hemos recibido tu solicitud de acceso. Un administrador debe aprobar tu cuenta antes de que puedas entrar.
    @if (email()) { La cuenta es <strong>{{ email() }}</strong>: si tarda, pídele al administrador que revise esa solicitud. }
  </p>

  @if (error()) {
    <p class="auth-msg err" role="alert">{{ error() }}</p>
  }

  <div class="auth-actions">
    <button type="button" class="btn btn-primary" (click)="recheck()" [disabled]="checking()">
      {{ checking() ? 'Comprobando…' : 'Recomprobar' }}
    </button>
    <button type="button" class="btn" (click)="logout()">Cerrar sesión</button>
  </div>
</app-auth-card>
